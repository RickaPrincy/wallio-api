info:
  title: wallio-api
  description: wallio
  version: 0.0.1
  contact: {}
tags:
  - name: Health
    description: ''
  - name: Users
    description: ''
  - name: Wallets
    description: ''
  - name: Init
    description: ''
  - name: Transactions
    description: ''
  - name: Projects
    description: ''
  - name: ProjectItems
    description: ''
  - name: Labels
    description: ''
  - name: Security
    description: ''
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    Dummy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
      required:
        - id
        - name
    ApiResponseError:
      type: object
      properties:
        statusCode:
          type: number
        message:
          type: string
        error:
          type: string
      required:
        - statusCode
        - message
        - error
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        avatarUrl:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - firstName
        - lastName
        - avatarUrl
        - email
        - createdAt
        - updatedAt
    CreateUser:
      type: object
      properties:
        id:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - lastName
        - firstName
        - email
        - createdAt
        - updatedAt
    WalletType:
      type: string
      enum:
        - CASH
        - BANK
        - MOBILE_MONEY
        - RECEIVABLE
        - DEBT
    Wallet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        balance:
          type: string
        description:
          type: string
        currency:
          type: string
          description: ISO 4217 code, MGA when missing
          example: MGA
        type:
          allOf:
            - $ref: '#/components/schemas/WalletType'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - balance
        - type
        - createdAt
        - updatedAt
        - deletedAt
    Whoami:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
        isVerified:
          type: boolean
      required:
        - token
        - user
        - isVerified
    Transaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        amount:
          type: string
          example: '150.50'
        description:
          type: string
        type:
          type: string
          enum:
            - EXPENSE
            - INCOME
            - TRANSFER
        labelId:
          type: string
          format: uuid
        counterparty:
          type: string
          description: Person, on debt and receivable accounts
        transferId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        walletId:
          type: string
          format: uuid
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
      required:
        - id
        - amount
        - description
        - createdAt
        - walletId
        - updatedAt
    Label:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - icon
        - color
        - createdAt
        - updatedAt
    Project:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        plannedAmount:
          type: string
          example: '1500.00'
        finishedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - createdAt
        - updatedAt
    ProjectItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        description:
          type: string
        amount:
          type: string
          example: '150.50'
        actualAmount:
          type: string
          example: '150.50'
        icon:
          type: string
        projectId:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
        executedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          type: string
          format: date-time
      required:
        - id
        - description
        - amount
        - projectId
        - createdAt
        - updatedAt
    InitInfo:
      type: object
      properties:
        wallets:
          type: array
          items:
            $ref: '#/components/schemas/Wallet'
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/Transaction'
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        projectItems:
          type: array
          items:
            $ref: '#/components/schemas/ProjectItem'
